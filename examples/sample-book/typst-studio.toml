[project]
name = "sample-book"
typst = "0.14.2"

[fonts]
paths = ["fonts"]
system = false

[book]
entry = "main.typ"
preview_profile = "print"

[preview]
entry = "preview.typ"
inputs = { ARTICLE = "{article_entry}", EBOOK = "true" }

[articles]
glob = "articles/**/article.typ"
image_dirs = ["images"]
upload_dir = "images"

[[articles.override]]
match = "articles/author-b/**"
inputs = { CATEGORY = "コラム" }

[profiles.print]
entry = "main.typ"
output = "main.pdf"

[profiles.ebook]
entry = "main.typ"
inputs = { EBOOK = "true" }
output = "ebook-body.pdf"
